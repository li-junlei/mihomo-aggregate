name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_worker.py test_panel.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_panel_ui.js
      - run: node test_panel_i18n.js
