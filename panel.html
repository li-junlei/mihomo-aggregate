<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订阅管理</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#193d43;background:#f3f7f8;font-synthesis:none}*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:48px 28px}button,input{font:inherit}button,a.action{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#167d86;color:white;text-decoration:none;font-weight:600}button.secondary{background:#e9f1f2;color:#27565d}button.danger{background:#fff0ef;color:#ac4141}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #298eaa;outline-offset:4px}.header,.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:32px;letter-spacing:-1px;margin:6px 0}h2{font-size:20px;margin:0}p{color:#70858a;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:2px;color:#17828c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.stat,.surface{background:white;border:1px solid #e1ebed;border-radius:20px;padding:22px}.stat strong{font-size:28px;display:block;margin-top:8px}.muted,label{color:#70858a;font-size:13px}.airports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:20px 0 32px}.cup{position:relative;overflow:hidden;min-height:330px;border:2px solid #d1e9eb;border-radius:22px 22px 38px 38px;background:#fff;box-shadow:0 12px 28px #244e5810;cursor:pointer;transition:transform .2s,border-color .2s;isolation:isolate}.cup:hover,.cup.expanded{transform:translateY(-3px);border-color:#53afb5}.cup.disabled{border-color:#efb4b4;--water:#efb2b2;--wave:#f6cccc}.cup{--water:#a2dcdb;--wave:#c4eeeb}.water{position:absolute;bottom:0;left:0;width:100%;height:var(--level,0%);background:var(--water);z-index:-1;transition:height 1.2s ease}.water:before{content:'';position:absolute;top:-10px;left:-25%;width:150%;height:22px;background:var(--wave);border-radius:45%;animation:wave 5s ease-in-out infinite alternate}.cup.unknown .water{height:28%;background:#edf1f3}.cup.unknown .water:before{display:none}@keyframes wave{from{transform:translateX(-4%) rotate(-2deg)}to{transform:translateX(4%) rotate(2deg)}}.content{position:relative;padding:23px;min-height:326px;display:flex;flex-direction:column}.name{font-size:20px;font-weight:700;overflow-wrap:anywhere;margin:0}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#ffffffbc;color:#347078}.disabled .badge{color:#ac4141}.balance{margin:30px 0 22px}.percent{font-size:52px;letter-spacing:-2px;font-weight:700}.balance p{margin:2px 0;color:#355e64}.detail{font-size:12px;color:#365d63;line-height:1.9}.warning{color:#95422f;font-weight:600}.actions{display:none;gap:8px;margin-top:16px}.expanded .actions{display:flex}.actions>*{flex:1;text-align:center;font-size:13px;padding:10px}.add{min-height:330px;background:transparent;border:2px dashed #c6dadd;border-radius:22px;color:#6b959c;font-weight:500}.add span{font-size:36px;display:block;margin-bottom:8px}.surface{margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;margin:16px 0}.field input{display:block;width:100%;padding:12px;margin-top:7px;background:#f8fbfc;border:1px solid #d3e1e4;border-radius:10px;color:#193d43}.field input[readonly]{background:#edf2f3}.checkbox{display:flex;align-items:center;gap:8px;margin:18px 0}.checkbox input{width:18px;height:18px}.link{overflow-wrap:anywhere;font-family:monospace}details summary{cursor:pointer;font-weight:600}dialog{border:1px solid #deeaec;border-radius:24px;width:min(560px,calc(100% - 28px));max-height:90vh;padding:26px;color:#193d43;box-shadow:0 30px 100px #123c4833}dialog::backdrop{background:#183e4866;backdrop-filter:blur(5px)}.close{background:#eff4f5;color:#496970;padding:8px 13px}.error{color:#ac4141;min-height:20px;font-size:13px}#notice{position:sticky;bottom:18px;background:#193d43;color:white;border-radius:12px;padding:12px 18px;display:none;z-index:5}#notice.visible{display:block}small{font-size:11px;color:#638187}@media(max-width:850px){.airports{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){body{padding:26px 16px}.airports,.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:23px}.header h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<header class="header"><div><div class="eyebrow">SUBSCRIPTION MANAGER</div><h1>让连接，一目了然。</h1><p style="margin:8px 0">订阅管理 · 在这里维护机场，分享链接始终不变。</p></div><div class="bar"><span id="job" class="muted">读取中</span><button id="refresh">更新全部</button></div></header>
<section class="stats" aria-label="订阅概况"><div class="stat"><span class="muted">保留节点</span><strong id="published">—</strong></div><div class="stat"><span class="muted">最近检测可用</span><strong id="healthy">—</strong></div><div class="stat"><span class="muted">最近完成</span><strong id="checked" style="font-size:16px">—</strong></div></section>
<div class="bar"><h2>我的机场</h2><span class="muted">单击卡片，展开操作</span></div><section id="airports" class="airports" aria-label="机场订阅"></section>
<section class="surface"><details><summary>固定分享链接</summary><p id="link" class="link"></p><button class="secondary" id="copy">复制链接</button></details></section>
<section class="surface"><div class="bar"><h2>更新设置</h2><button class="secondary" id="check">仅检查节点</button></div><div class="grid"><label class="field">正常拉取间隔（分钟）<input id="fetchInterval" type="number" min="1" required></label><label class="field">节点检测间隔（分钟）<input id="healthInterval" type="number" min="1" required></label></div><div class="bar"><small id="rules">分流规则读取中</small><button id="saveIntervals">保存间隔</button></div></section>
<div id="notice" role="status"></div>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><div class="bar"><h2 id="editorTitle">编辑机场</h2><button type="button" class="close" id="close" aria-label="关闭">✕</button></div><label class="field">机场名称<input id="sourceName" maxlength="80" placeholder="例如 Ytoo"></label><label class="field">机场 ID<input id="sourceId" required pattern="[a-zA-Z0-9_-]{1,40}" maxlength="40"></label><label class="field">机场官网（可选）<input id="website" type="url" placeholder="https://example.com" maxlength="2048"></label><label class="field">HTTPS 订阅地址<input id="sourceUrl" type="password" required autocomplete="off"></label><label class="field">拉取代理（留空为直连）<input id="proxy" type="password" autocomplete="off"></label><button id="reveal" type="button" class="secondary">显示 / 隐藏地址</button><label class="field">客户端标识<input id="ua"></label><label class="checkbox"><input id="enabled" type="checkbox">启用机场</label><p id="readonlyInfo" class="muted"></p><div id="formError" class="error" role="alert"></div><div class="bar"><button id="remove" type="button" class="danger">移除机场</button><div class="bar"><button id="cancel" type="button" class="secondary">取消</button><button type="submit" id="submit">保存并更新</button></div></div></form></dialog>
<script>
let cfg,subscription='',snapshot={},expanded=null,editing=-1,original='',opener,noticeTimer;const $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Panel-Request':'1'}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function notice(s){$('notice').textContent=s;$('notice').classList.add('visible');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('visible'),7000)}
function bytes(n){if(n==null)return '未提供';let u=['B','KiB','MiB','GiB','TiB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?2:0)+' '+u[i]}
function date(t){return t?new Date(t*1000).toLocaleString():'未提供'}
function safeSite(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:null}catch{return null}}
function airportData(s){return {...snapshot.airports?.[s.id],...snapshot.status?.sources?.[s.id]}}
function setExpanded(id){expanded=id;document.querySelectorAll('.cup').forEach(el=>{const on=el.dataset.id===id;el.classList.toggle('expanded',on);el.querySelector('.content').setAttribute('aria-expanded',String(on))})}
function cardUpdate(el,s){const d=airportData(s),info=d.subscription_info,known=info?.total_bytes>0&&info.remaining_bytes!=null,percent=known?Math.min(100,Math.max(0,info.remaining_bytes/info.total_bytes*100)):null;el.classList.toggle('disabled',s.enabled===false);el.classList.toggle('unknown',!known);el.style.setProperty('--level',(percent??0)+'%');el.querySelector('.name').textContent=s.name||s.id;el.querySelector('.badge').textContent=s.enabled===false?'未启用':'已启用';el.querySelector('.percent').textContent=known?Math.round(percent)+'%':'—';el.querySelector('.traffic').textContent=known?'剩余 '+bytes(info.remaining_bytes)+' / '+bytes(info.total_bytes):'流量未提供';el.querySelector('.expiry').textContent='到期日 · '+date(info?.expires_at);el.querySelector('.nodes').textContent='可用节点 '+(d.healthy??'—')+' / 保留 '+(d.cached??'—');el.querySelector('.updated').textContent='信息更新 · '+date(info?.updated_at);let hints=[];if(percent!==null&&percent<10)hints.push('流量不足');if(info?.expires_at&&info.expires_at*1000<Date.now())hints.push('已到期');if(d.fetch_or_probe_error)hints.push('拉取或检测异常，使用缓存');el.querySelector('.warning').textContent=hints.join(' · ')}
function renderCards(){const focus=document.activeElement?.closest('.cup')?.dataset.id;$('airports').replaceChildren();cfg.sources.forEach((s,i)=>{const el=document.createElement('article');el.className='cup';el.dataset.id=s.id;el.innerHTML='<div class="water" aria-hidden="true"></div><div class="content" role="button" tabindex="0" aria-expanded="false"><div class="bar"><h3 class="name"></h3><span class="badge"></span></div><div class="balance"><div class="percent"></div><p class="traffic"></p></div><div class="detail expiry"></div><div class="detail nodes"></div><small class="updated"></small><div class="detail warning"></div></div><div class="actions" style="position:relative;padding:0 23px 23px"><button class="edit">编辑</button><button class="visit secondary">访问官网</button></div>';const content=el.querySelector('.content');content.onclick=()=>setExpanded(expanded===s.id?null:s.id);content.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();content.click()}};el.querySelector('.edit').onclick=e=>openEditor(i,e.currentTarget);const site=safeSite(s.website),visit=el.querySelector('.visit');visit.disabled=!site;visit.title=site?'在新标签页打开官网':'未设置官网';visit.onclick=()=>window.open(site,'_blank','noopener,noreferrer');cardUpdate(el,s);$('airports').append(el)});const add=document.createElement('button');add.className='add';add.innerHTML='<span aria-hidden="true">＋</span>添加机场';add.onclick=e=>openEditor(-1,e.currentTarget);$('airports').append(add);setExpanded(expanded);if(focus)document.querySelectorAll('.cup').forEach(el=>{if(el.dataset.id===focus)el.querySelector('.content').focus()})}
function draft(){return {name:$('sourceName').value.trim(),id:$('sourceId').value.trim(),website:$('website').value.trim(),url:$('sourceUrl').value.trim(),fetch_proxy:$('proxy').value.trim(),headers:{...(cfg.sources[editing]?.headers||{}),'User-Agent':$('ua').value.trim()},enabled:$('enabled').checked}}
function openEditor(index,button){editing=index;opener=button;const s=cfg.sources[index]||{enabled:true};$('editorTitle').textContent=index<0?'添加机场':'编辑机场';for(const [id,val] of [['sourceName',s.name||s.id||''],['sourceId',s.id||''],['website',s.website||''],['sourceUrl',s.url||''],['proxy',s.fetch_proxy||''],['ua',s.headers?.['User-Agent']||'clash.meta']])$(id).value=val;$('sourceId').readOnly=index>=0;$('enabled').checked=s.enabled!==false;$('remove').hidden=index<0;$('formError').textContent='';$('sourceUrl').type=$('proxy').type='password';const info=airportData(s).subscription_info;$('readonlyInfo').textContent='机场提供的数据：剩余 '+bytes(info?.remaining_bytes)+'；到期日 '+date(info?.expires_at);original=JSON.stringify(draft());$('editor').showModal();$('sourceName').focus()}
function closeEditor(){if(JSON.stringify(draft())!==original&&!confirm('放弃尚未保存的修改？'))return;$('editor').close()}
$('close').onclick=$('cancel').onclick=closeEditor;$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('editor').addEventListener('close',()=>{if(opener?.isConnected)opener.focus();else $('refresh').focus()});$('reveal').onclick=()=>{for(const id of ['sourceUrl','proxy'])$(id).type=$(id).type==='password'?'text':'password'};
async function saveConfig(next){await api('config',next);cfg=next;renderCards();notice('已保存，后台将更新订阅。')}
$('form').onsubmit=async e=>{e.preventDefault();const s=draft();if(!s.url.startsWith('https://')){$('formError').textContent='订阅地址必须使用 HTTPS';return}if(s.website&&!safeSite(s.website)){$('formError').textContent='官网必须使用 HTTP/HTTPS，且不能包含账号密码';return}const next=structuredClone(cfg);if(editing<0)next.sources.push(s);else next.sources[editing]={...next.sources[editing],...s};$('submit').disabled=true;try{await saveConfig(next);$('editor').close()}catch(err){$('formError').textContent=err.message}finally{$('submit').disabled=false}};
$('remove').onclick=async()=>{if(!confirm('移除此机场？缓存节点将不再包含于分享订阅。'))return;const next=structuredClone(cfg);next.sources.splice(editing,1);$('remove').disabled=true;try{await saveConfig(next);$('editor').close()}catch(e){$('formError').textContent=e.message}finally{$('remove').disabled=false}};
document.addEventListener('click',e=>{if(!e.target.closest('.cup')&&!e.target.closest('dialog'))setExpanded(null)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('editor').open)setExpanded(null)});
async function status(){snapshot=await api('status');const s=snapshot.status;$('published').textContent=s.published??'—';$('healthy').textContent=s.healthy??'—';$('checked').textContent=date(s.checked_at);$('job').textContent=snapshot.running.busy?'● 后台更新中':'● 后台待机';document.querySelectorAll('.cup').forEach(el=>{const source=cfg.sources.find(s=>s.id===el.dataset.id);if(source)cardUpdate(el,source)});$('rules').textContent=snapshot.rules.updated_at?'分流规则更新：'+date(snapshot.rules.updated_at)+(snapshot.rules.error?' · 使用缓存':''):'分流规则等待更新'}
for(const [id,fetch] of [['refresh',true],['check',false]])$(id).onclick=async()=>{try{await api('refresh',{fetch});notice('已提交，后台完成后自动更新。');await status()}catch(e){notice(e.message)}};
$('saveIntervals').onclick=async()=>{try{const f=Number($('fetchInterval').value),h=Number($('healthInterval').value);if(!Number.isFinite(f)||!Number.isFinite(h)||f<1||h<1)throw Error('间隔至少为 1 分钟');const next=structuredClone(cfg);next.fetch_interval=Math.round(f*60);next.health_interval=Math.round(h*60);await saveConfig(next)}catch(e){notice(e.message)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(subscription);notice('已复制')}catch{notice('请选中链接手动复制')}};
(async()=>{try{const d=await api('config');cfg=d.config;subscription=d.subscription_url;$('link').textContent=subscription;$('fetchInterval').value=cfg.fetch_interval/60;$('healthInterval').value=cfg.health_interval/60;await status();renderCards();setInterval(()=>status().catch(()=>notice('状态读取失败，请刷新页面')),5000)}catch(e){notice(e.message)}})();
</script></body></html>
